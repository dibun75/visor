name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      VISOR_HOME: /tmp/visor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      VISOR_HOME: /tmp/visor
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
      - name: MCP handshake smoke
        if: matrix.python-version == '3.12'
        run: uv run pytest tests/test_mcp_headless.py -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      VISOR_HOME: /tmp/visor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev --python 3.12
      - name: Build package
        run: uv build
      - name: Audit wheel contents
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          unzip -Z1 "$wheel" > /tmp/visor-wheel-files.txt
          ! grep -Eq '(^|/)(hud|extension|node_modules|playwright-report|test-results|__pycache__)(/|$)' /tmp/visor-wheel-files.txt
          test "$(stat -c%s "$wheel")" -lt 1048576
      - name: Verify CLI
        run: uv run visor --version
      - name: Verify CLI initialization
        run: uv run visor init

  hud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/visor/hud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/visor/hud/package-lock.json
      - name: Install HUD dependencies
        run: npm ci
      - name: Lint HUD
        run: npm run lint
      - name: Build HUD
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Test HUD
        run: npx playwright test

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            src/visor/hud/package-lock.json
            src/visor/extension/package-lock.json
      - name: Build HUD for extension package
        working-directory: ./src/visor/hud
        run: npm ci && npm run build
      - name: Install extension dependencies
        working-directory: ./src/visor/extension
        run: npm ci
      - name: Type-check extension
        working-directory: ./src/visor/extension
        run: npm run check-types
      - name: Compile extension
        working-directory: ./src/visor/extension
        run: npm run compile
      - name: Audit extension package
        working-directory: ./src/visor/extension
        run: npx --yes @vscode/vsce package --no-dependencies --out /tmp/visor-hud.vsix
      - name: Inspect extension artifact
        run: unzip -l /tmp/visor-hud.vsix

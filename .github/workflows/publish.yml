name: Release Packages

on:
  release:
    types: [published]

jobs:
  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-openvsx:
    name: Build & Publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Build Web HUD
        working-directory: src/visor/hud
        run: |
          npm ci
          npm run build

      - name: Install Extension Dependencies
        working-directory: src/visor/extension
        run: npm ci

      - name: Create Open VSX Namespace (if needed)
        working-directory: src/visor/extension
        run: npx ovsx create-namespace dibun75 -p ${{ secrets.OVSX_PAT }} || true

      - name: Publish to Open VSX
        working-directory: src/visor/extension
        run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
